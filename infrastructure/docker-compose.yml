version: '3.9'

networks:
  default:
    name: astropong

services:
  frontend:
    build: 
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ../frontend/app:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend
    volumes:
      - ../backend/app:/app
    ports:
      - "8000:8000"
    depends_on:
      - database
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  database:
    image: postgres:13
    container_name: postgres-db
    volumes:
      - ./database/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
